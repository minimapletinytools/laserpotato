<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laser Potato</title>
    <link data-trunk rel="rust" data-bin="play" data-wasm-opt="z" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0b0d14;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f0f4fc;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bevy-canvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }

        /* Loading indicator shown before WASM initializes */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #080a10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.4s ease-out;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(80, 180, 255, 0.2);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #8fa0bc;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="title">LASER POTATO</div>
        <div class="subtitle">Loading 3D Engine & Puzzles...</div>
    </div>

    <div id="canvas-container">
        <canvas id="bevy-canvas"></canvas>
    </div>

    <script>
        // Dismiss loading screen when Bevy renders its first canvas frame
        const observer = new MutationObserver(() => {
            const canvas = document.getElementById('bevy-canvas');
            if (canvas && (canvas.width > 0 || canvas.getAttribute('width'))) {
                const loader = document.getElementById('loading-screen');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 400);
                }
                observer.disconnect();
            }
        });
        observer.observe(document.body, { attributes: true, childList: true, subtree: true });
    </script>
</body>
</html>
