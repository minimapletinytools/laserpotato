[package]
name = "laserpotato"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "laserpotato"
path = "src/lib.rs"

[[bin]]
name = "laserpotato"
path = "src/main.rs"

[[bin]]
name = "solver"
path = "src/bin/solver.rs"

[dependencies]
bevy = "0.19.0"
glam = { version = "0.32", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
